name: CI Build & Lint

on:
  push:
    branches: [ master, Aryan ]
  pull_request:
    branches: [ master, Aryan ]

jobs:
  lint-and-build:
    name: Build Verification & Lint Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Verify Frontend Compilation
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Check Backend Setup
        run: |
          cd backend
          npm ci
