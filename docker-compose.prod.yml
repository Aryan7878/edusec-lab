version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edusec-labs:latest
    container_name: edusec-labs-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - SERVE_STATIC=true
      - MONGODB_URI=mongodb://mongodb:27017/edusec-labs
      # IMPORTANT: Set this to a strong random secret before deploying
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-key}
      # Set to your Cloudflare Pages domain, e.g.: https://edusec.pages.dev
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # Optional: your OpenAI key for the AI Tutor (leave blank to use offline KB)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Required: gives backend access to host Docker to spin up lab containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - edusec-net

  mongodb:
    image: mongo:6.0
    container_name: edusec-labs-db
    restart: always
    expose:
      - "27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edusec-net

networks:
  edusec-net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
