version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edusec-labs:latest
    container_name: edusec-labs-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/edusec-labs
      - JWT_SECRET=change-this-to-a-secure-key-in-prod
      - NODE_ENV=production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6.0
    container_name: edusec-labs-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
    driver: local
